<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOT CPV Code Search — with anywhere_exact_start</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #60a5fa;
      --accent-2: #34d399;
      --danger: #ef4444;
      --highlight-bg: #fde68a;
      --highlight-text: #111827;
      --border: #1f2937;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: linear-gradient(180deg, #0b1020 0%, #0f172a 100%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      line-height: 1.4;
    }

    h2 {
      margin: 0 0 16px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 16px;
      margin-bottom: 14px;
    }

    .toggle-switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      user-select: none;
    }

    .toggle-switch input { display: none; }

    .slider {
      position: relative;
      width: 48px;
      height: 26px;
      background: #374151;
      border-radius: 999px;
      transition: background 0.2s ease;
      border: 1px solid var(--border);
    }

    .slider::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 22px;
      height: 22px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .toggle-switch input:checked + .slider {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    }

    .toggle-switch input:checked + .slider::after {
      transform: translateX(22px);
    }

    .toggle-label {
      font-size: 14px;
      color: var(--muted);
    }

    #searchBox {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      outline: none;
      box-shadow: inset 0 0 0 1px transparent;
      transition: box-shadow 0.15s ease, border 0.15s ease;
    }
    #searchBox::placeholder { color: #6b7280; }
    #searchBox:focus {
      border-color: #394458;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.25);
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 16px;
      align-items: start;
      margin-top: 14px;
    }

    #resultList {
      list-style: none;
      margin: 0;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(17, 24, 39, 0.65);
      backdrop-filter: blur(4px);
      max-height: 60vh;
      overflow: auto;
    }

    #resultList li {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    #resultList li:last-child { border-bottom: none; }
    #resultList li:hover, #resultList li.active { background: rgba(55, 65, 81, 0.35); }

    #selectedBox {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(17, 24, 39, 0.65);
      color: var(--text);
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .button-row button {
      padding: 10px 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.05s ease, background 0.15s ease;
    }
    .button-row button:hover { background: #1b2433; }
    .button-row button:active { transform: translateY(1px); }
    .button-row button.danger { border-color: #3a1b1b; color: #fecaca; background: #2b1111; }

    .highlight { background: var(--highlight-bg); color: var(--highlight-text); padding: 0 2px; border-radius: 3px; }
    .not-found { color: #fca5a5; padding: 10px 12px; }

    @media (max-width: 980px) {
      .two-col { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h2>TOT CPV Code Search</h2>

  <div class="toolbar">
    <label class="toggle-switch" title="Prefix Search (string start)">
      <input type="checkbox" id="prefixModeToggle" />
      <span class="slider"></span>
      <span class="toggle-label">Prefix Search Mode</span>
    </label>

    <label class="toggle-switch" title="Anywhere Exact Start (match at word boundary)">
      <input type="checkbox" id="anywhereStartToggle" />
      <span class="slider"></span>
      <span class="toggle-label">Anywhere Exact Start</span>
    </label>
  </div>

  <input
    type="text"
    id="searchBox"
    placeholder="Enter CPV code, keyword, or prefixes separated by commas..."
    autocomplete="off"
  />

  <div class="two-col">
    <ul id="resultList"></ul>

    <div>
      <textarea id="selectedBox" placeholder="Selected CPV codes will appear here, separated by commas..."></textarea>
      <div class="button-row">
        <button class="danger" onclick="cutSelected()">Cut Selected</button>
        <button onclick="copySelected()">Copy Selected</button>
      </div>
    </div>
  </div>

  <script>
    // NOTE: Replace this sample with the full cpvData you provided previously
    const cpvData = [
      "03000000\tAgricultural, farming, fishing, forestry and related products",
      "03100000\tCrops, products of market gardening and horticulture",
      "03200000\tCereals, potatoes, vegetables, fruits and nuts",
      "03300000\tFarming and animal products",
      "03400000\tForestry and logging products",
      "60100000\tRoad transport services",
      "72000000\tIT services: consulting, software development, Internet and support",
      "72200000\tSoftware programming and consultancy services",
      "72224000\tProject management consultancy services",
      "73000000\tResearch and development services and related consultancy services",
      "80000000\tEducation and training services",
      "85000000\tHealth and social work services",
      "85300000\tSocial work and related services",
      "98000000\tOther community, social and personal services",
      "98513100\tAgency staff services for households",
      "98513200\tClerical staff services for households",
      "98513300\tTemporary staff for households",
      "98513310\tHome-help services",
      "98514000\tDomestic services",
      "98900000\tServices provided by extra-territorial organisations and bodies",
      "98910000\tServices specific to international organisations and bodies",
    ];

    const searchBox = document.getElementById('searchBox');
    const resultList = document.getElementById('resultList');
    const selectedBox = document.getElementById('selectedBox');

    const prefixModeToggle = document.getElementById('prefixModeToggle');
    const anywhereStartToggle = document.getElementById('anywhereStartToggle');

    // Ensure toggles are mutually exclusive
    function setExclusiveToggle(changed) {
      if (changed === 'prefix' && prefixModeToggle.checked) {
        anywhereStartToggle.checked = false;
      } else if (changed === 'anywhere' && anywhereStartToggle.checked) {
        prefixModeToggle.checked = false;
      }
      updateResults();
    }

    prefixModeToggle.addEventListener('change', () => setExclusiveToggle('prefix'));
    anywhereStartToggle.addEventListener('change', () => setExclusiveToggle('anywhere'));

    let currentFocusIndex = -1;

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeRegex(text) {
      return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function parseRow(row) {
      const [code, ...rest] = row.split(/\s+/, 2);
      // If the first split by whitespace did not yield full description (because code may include only first token),
      // re-split by tab first, then fallback.
      const tabParts = row.split('\t');
      if (tabParts.length >= 2) return { code: tabParts[0], desc: tabParts.slice(1).join(' ').trim() };
      return { code: code || row, desc: rest.join(' ') };
    }

    function matchesTerms(rowText, terms) {
      if (terms.length === 0) return false;

      const rowLower = rowText.toLowerCase();
      const { code, desc } = parseRow(rowText);
      const codeLower = code.toLowerCase();
      const descLower = desc.toLowerCase();

      const prefixMode = prefixModeToggle.checked;
      const anywhereStartMode = anywhereStartToggle.checked;

      // Every term must match
      return terms.every(term => {
        if (!term) return true;
        if (prefixMode) {
          // Match at start of the whole string (code or description)
          return codeLower.startsWith(term) || descLower.startsWith(term);
        } else if (anywhereStartMode) {
          // Match at start of any word (word boundary) in code or desc
          const pattern = new RegExp('\\b' + escapeRegex(term), 'i');
          return pattern.test(code) || pattern.test(desc);
        } else {
          // Default: substring match anywhere
          return codeLower.includes(term) || descLower.includes(term);
        }
      });
    }

    function highlightText(rowText, terms) {
      if (terms.length === 0) return escapeHtml(rowText);

      const { code, desc } = parseRow(rowText);
      const prefixMode = prefixModeToggle.checked;
      const anywhereStartMode = anywhereStartToggle.checked;

      function highlightSegment(text) {
        let html = escapeHtml(text);
        // Apply each term highlighting; avoid double-wrapping by replacing on the original string progressively
        terms.forEach(term => {
          if (!term) return;
          let regex;
          if (prefixMode) {
            regex = new RegExp('^(' + escapeRegex(term) + ')', 'i');
          } else if (anywhereStartMode) {
            regex = new RegExp('\\b(' + escapeRegex(term) + ')', 'gi');
          } else {
            regex = new RegExp('(' + escapeRegex(term) + ')', 'gi');
          }
          html = html.replace(regex, '<span class="highlight">$1</span>');
        });
        return html;
      }

      return highlightSegment(code) + '\t' + highlightSegment(desc);
    }

    function renderResults(matches, terms) {
      resultList.innerHTML = '';
      currentFocusIndex = -1;

      if (matches.length === 0) {
        const li = document.createElement('li');
        li.className = 'not-found';
        li.textContent = 'No results found';
        resultList.appendChild(li);
        return;
      }

      const fragment = document.createDocumentFragment();
      matches.forEach(row => {
        const li = document.createElement('li');
        li.innerHTML = highlightText(row, terms);
        li.addEventListener('click', () => selectCPV(row));
        fragment.appendChild(li);
      });
      resultList.appendChild(fragment);
    }

    function normalizeTerms(input) {
      return input
        .split(',')
        .map(s => s.trim().toLowerCase())
        .filter(Boolean);
    }

    function updateResults() {
      const query = searchBox.value.trim();
      const terms = normalizeTerms(query);
      if (query === '') {
        resultList.innerHTML = '';
        currentFocusIndex = -1;
        return;
      }

      const matches = cpvData.filter(row => matchesTerms(row, terms)).slice(0, 250);
      renderResults(matches, terms);
    }

    function addCPVToBox(code) {
      const existing = selectedBox.value.trim();
      if (!existing) {
        selectedBox.value = code;
      } else {
        // Avoid duplicate consecutive commas
        selectedBox.value = existing.replace(/,\s*$/,'') + ', ' + code;
      }
    }

    function selectCPV(row) {
      const { code } = parseRow(row);
      addCPVToBox(code);
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      // Fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } finally { document.body.removeChild(ta); }
      return Promise.resolve();
    }

    function copySelected() {
      const text = selectedBox.value.trim();
      if (!text) return;
      copyToClipboard(text);
    }

    function cutSelected() {
      const text = selectedBox.value.trim();
      if (!text) return;
      copyToClipboard(text).then(() => { selectedBox.value = ''; });
    }

    searchBox.addEventListener('input', updateResults);

    // Keyboard navigation in result list
    searchBox.addEventListener('keydown', (e) => {
      const items = Array.from(resultList.querySelectorAll('li'));
      if (items.length === 0) return;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        currentFocusIndex = (currentFocusIndex + 1) % items.length;
        setActive(items, currentFocusIndex);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        currentFocusIndex = (currentFocusIndex - 1 + items.length) % items.length;
        setActive(items, currentFocusIndex);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (currentFocusIndex >= 0 && currentFocusIndex < items.length) {
          items[currentFocusIndex].click();
        }
      }
    });

    function setActive(items, idx) {
      items.forEach(el => el.classList.remove('active'));
      if (idx >= 0 && idx < items.length) items[idx].classList.add('active');
      // Ensure visibility
      const el = items[idx];
      if (el) {
        const listRect = resultList.getBoundingClientRect();
        const elRect = el.getBoundingClientRect();
        if (elRect.top < listRect.top) {
          resultList.scrollTop -= (listRect.top - elRect.top) + 8;
        } else if (elRect.bottom > listRect.bottom) {
          resultList.scrollTop += (elRect.bottom - listRect.bottom) + 8;
        }
      }
    }
  </script>
</body>
</html>
