<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TOT CPV Code Search — with anywhere_exact_start</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; }
    h2 { margin-top: 0; }

    .controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }

    .toggle { display: inline-flex; align-items: center; gap: 8px; user-select: none; }

    #searchBox { width: 100%; max-width: 920px; padding: 10px 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }

    ul { list-style: none; padding-left: 0; margin-top: 10px; max-width: 920px; }
    li { padding: 8px 10px; border: 1px solid #eee; border-radius: 6px; margin-bottom: 8px; cursor: pointer; }
    li:hover { background: #fafafa; }

    .highlight { background: #fff2a8; padding: 0 2px; border-radius: 3px; }

    #selectedBox { width: 100%; max-width: 920px; min-height: 100px; margin-top: 12px; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; }

    .button-row { display: flex; gap: 10px; margin-top: 10px; }
    .button-row button { padding: 8px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; background: #f6f6f6; cursor: pointer; }
    .button-row button:hover { background: #eee; }

    .meta { color: #666; font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>
  <h2>TOT CPV Code Search</h2>

  <div class="controls">
    <label class="toggle">
      <input type="checkbox" id="prefixModeToggle" />
      <span>Prefix Search Mode</span>
    </label>
    <label class="toggle">
      <input type="checkbox" id="anywhereExactStartToggle" />
      <span>Anywhere Exact Start</span>
    </label>
  </div>

  <input
    type="text"
    id="searchBox"
    placeholder="Enter CPV code, keyword, or prefixes separated by commas..."
    autocomplete="off"
  />

  <ul id="resultList"></ul>

  <textarea
    id="selectedBox"
    placeholder="Selected CPV codes will appear here, separated by commas..."
  ></textarea>
  <div class="button-row">
    <button type="button" id="cutButton">Cut Selected</button>
    <button type="button" id="copyButton">Copy Selected</button>
  </div>

  <div class="meta">Tip: Toggle "Anywhere Exact Start" to match your terms at the beginning of any word in code or description. Toggle "Prefix Search Mode" to anchor at the very start of the entry.</div>

  <script>
    // SAMPLE DATA — replace with your full cpvData array
    const cpvData = [
      "03000000\tAgricultural, farming, fishing, forestry and related products",
      "03100000\tAgricultural and horticultural products",
      "03110000\tCrops, products of market gardening and horticulture",
      "98513100\tAgency staff services for households",
      "98513200\tClerical staff services for households",
      "98513300\tTemporary staff for households",
      "98513310\tHome-help services",
      "98514000\tDomestic services",
      "98900000\tServices provided by extra-territorial organisations and bodies",
      "98910000\tServices specific to international organisations and bodies"
    ];

    const searchBox = document.getElementById('searchBox');
    const resultList = document.getElementById('resultList');
    const selectedBox = document.getElementById('selectedBox');

    const prefixModeToggle = document.getElementById('prefixModeToggle');
    const anywhereExactStartToggle = document.getElementById('anywhereExactStartToggle');

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeRegExp(text) {
      return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function parseEntry(entry) {
      const [code, description = ''] = entry.split('\t');
      return { code, description };
    }

    function normalize(text) {
      return text.toLowerCase();
    }

    function splitTerms(rawQuery) {
      return rawQuery
        .split(',')
        .map(part => part.trim())
        .filter(Boolean);
    }

    function recordMatches(entryText, terms, { modePrefix, modeAnywhereStart }) {
      const lowerText = normalize(entryText);

      if (modePrefix) {
        // All terms must match from the very start of the entry text (joined with space)
        // Implemented as: the first term must match at start; others must exist anywhere
        if (terms.length === 0) return false;
        const [first, ...rest] = terms;
        if (!lowerText.startsWith(normalize(first))) return false;
        return rest.every(t => lowerText.includes(normalize(t)));
      }

      if (modeAnywhereStart) {
        // Each term must match the start of some word (word-boundary) anywhere in the text
        return terms.every(term => {
          const pattern = new RegExp('\\b' + escapeRegExp(term), 'i');
          return pattern.test(entryText);
        });
      }

      // Default: contains-anywhere for all terms
      return terms.every(term => lowerText.includes(normalize(term)));
    }

    function highlightText(entryText, terms, { modePrefix, modeAnywhereStart }) {
      if (terms.length === 0) return escapeHtml(entryText);

      let resultHtml = escapeHtml(entryText);

      if (modePrefix) {
        const first = terms[0];
        if (!first) return resultHtml;
        const pattern = new RegExp('^(' + escapeRegExp(first) + ')', 'i');
        resultHtml = resultHtml.replace(pattern, '<span class="highlight">$1</span>');
        return resultHtml;
      }

      if (modeAnywhereStart) {
        // Highlight each term at word starts (independently)
        terms.forEach(term => {
          if (!term) return;
          const pattern = new RegExp('\\b(' + escapeRegExp(term) + ')', 'ig');
          resultHtml = resultHtml.replace(pattern, '<span class="highlight">$1</span>');
        });
        return resultHtml;
      }

      // Default: highlight occurrences anywhere
      terms.forEach(term => {
        if (!term) return;
        const pattern = new RegExp('(' + escapeRegExp(term) + ')', 'ig');
        resultHtml = resultHtml.replace(pattern, '<span class="highlight">$1</span>');
      });
      return resultHtml;
    }

    function buildListItem(entry, terms, modes) {
      const { code, description } = parseEntry(entry);
      const content = `${code} — ${description}`;
      const highlighted = highlightText(content, terms, modes);

      const li = document.createElement('li');
      li.innerHTML = highlighted;
      li.addEventListener('click', () => selectCPV(code));
      return li;
    }

    function updateResults() {
      const rawQuery = searchBox.value.trim();
      const terms = splitTerms(rawQuery);

      const modes = {
        modePrefix: prefixModeToggle.checked,
        modeAnywhereStart: anywhereExactStartToggle.checked,
      };

      // If both toggles are ON, prioritize Anywhere Exact Start for clarity
      // You can change this behavior if you prefer different precedence
      if (modes.modePrefix && modes.modeAnywhereStart) {
        modes.modePrefix = false;
      }

      // Filter and render
      const entries = cpvData.filter(entry => recordMatches(entry, terms, modes));

      resultList.innerHTML = '';
      if (entries.length === 0) {
        const li = document.createElement('li');
        li.textContent = 'No results found';
        resultList.appendChild(li);
        return;
      }

      const fragment = document.createDocumentFragment();
      entries.slice(0, 200).forEach(entry => fragment.appendChild(buildListItem(entry, terms, modes)));
      resultList.appendChild(fragment);
    }

    function addCPVToBox(code) {
      const existing = selectedBox.value
        .split(',')
        .map(s => s.trim())
        .filter(Boolean);
      if (!existing.includes(code)) existing.push(code);
      selectedBox.value = existing.join(', ');
    }

    function selectCPV(code) {
      addCPVToBox(code);
    }

    function copyToClipboard(text) {
      if (!navigator.clipboard) {
        const aux = document.createElement('textarea');
        aux.value = text;
        document.body.appendChild(aux);
        aux.select();
        try { document.execCommand('copy'); } finally { document.body.removeChild(aux); }
        return;
      }
      navigator.clipboard.writeText(text).catch(() => {});
    }

    function copySelected() {
      const text = selectedBox.value.trim();
      if (!text) return;
      copyToClipboard(text);
    }

    function cutSelected() {
      const text = selectedBox.value.trim();
      if (!text) return;
      copyToClipboard(text);
      selectedBox.value = '';
    }

    // Wire up events
    searchBox.addEventListener('input', updateResults);
    document.getElementById('copyButton').addEventListener('click', copySelected);
    document.getElementById('cutButton').addEventListener('click', cutSelected);
    prefixModeToggle.addEventListener('change', updateResults);
    anywhereExactStartToggle.addEventListener('change', updateResults);

    // Initial render
    updateResults();
  </script>
</body>
</html>
