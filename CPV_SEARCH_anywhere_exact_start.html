<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TOT CPV Code Search — anywhere | exact | start</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f1218;
      --panel: #141a23;
      --muted: #a9b1bb;
      --text: #e6edf3;
      --accent: #3b82f6;
      --accent-2: #22c55e;
      --border: #253043;
      --highlight-bg: #fde68a;
      --highlight-text: #1f2937;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: radial-gradient(1200px 600px at 20% -20%, #162033 0%, transparent 60%),
                  radial-gradient(1200px 600px at 80% -20%, #1a2338 0%, transparent 60%),
                  var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      line-height: 1.5;
    }
    h2 {
      margin: 0 0 16px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0));
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.03);
    }
    .row { display: grid; gap: 12px; }

    .mode-group {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .mode-segment {
      display: inline-flex;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 999px;
      overflow: hidden;
    }
    .mode-segment label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      cursor: pointer;
      color: var(--muted);
      user-select: none;
      transition: color 0.2s ease, background 0.2s ease;
      border-right: 1px solid var(--border);
    }
    .mode-segment label:last-child { border-right: 0; }
    .mode-segment input { display: none; }
    .mode-segment input:checked + span {
      color: var(--text);
      background: rgba(59,130,246,0.15);
    }

    #searchBox {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }
    #searchBox::placeholder { color: #6b7280; }
    #searchBox:focus { border-color: #35517a; box-shadow: 0 0 0 4px rgba(59,130,246,0.15); }

    #resultList {
      list-style: none;
      margin: 12px 0 0;
      padding: 0;
      max-height: 48vh;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
    }
    #resultList li {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #resultList li:last-child { border-bottom: none; }
    #resultList li:hover, #resultList li.active { background: rgba(59,130,246,0.10); }
    .code { font-weight: 700; color: var(--text); min-width: 110px; }
    .desc { color: var(--muted); }

    #selectedBox {
      width: 100%;
      min-height: 110px;
      margin-top: 12px;
      padding: 12px;
      font-size: 14px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      resize: vertical;
    }

    .button-row {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0));
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.02s ease, border-color 0.2s ease, background 0.2s ease;
    }
    .btn:hover { border-color: #35517a; background: rgba(59,130,246,0.10); }
    .btn:active { transform: translateY(1px); }
    .btn-danger:hover { border-color: rgba(239,68,68,0.6); background: rgba(239,68,68,0.12); }

    .highlight {
      background: var(--highlight-bg);
      color: var(--highlight-text);
      padding: 0 2px;
      border-radius: 3px;
    }

    .small { color: #7f8a98; font-size: 12px; }
  </style>
</head>
<body>
  <div class="row">
    <h2>TOT CPV Code Search</h2>

    <div class="mode-group">
      <div class="mode-segment" role="radiogroup" aria-label="Search mode">
        <label>
          <input type="radio" name="searchMode" value="anywhere" checked>
          <span>Anywhere</span>
        </label>
        <label>
          <input type="radio" name="searchMode" value="start">
          <span>Anywhere exact start</span>
        </label>
        <label>
          <input type="radio" name="searchMode" value="exact">
          <span>Exact</span>
        </label>
      </div>
      <span class="small">Separate multiple terms with commas</span>
    </div>

    <input id="searchBox" type="text" placeholder="Enter CPV code or keywords (comma-separated)" autocomplete="off" />

    <ul id="resultList" class="panel"></ul>

    <textarea id="selectedBox" class="panel" placeholder="Selected CPV codes will appear here, separated by commas..."></textarea>

    <div class="button-row">
      <button class="btn" id="copyBtn" type="button">Copy Selected</button>
      <button class="btn btn-danger" id="cutBtn" type="button">Cut Selected</button>
    </div>
  </div>

  <script>
    // Minimal sample data so the page works immediately. Replace with your full dataset.
    const cpvData = [
      "03000000\tAgricultural, farming, fishing, forestry and related products",
      "30200000\tComputer equipment and supplies",
      "30230000\tComputer-related equipment",
      "72200000\tSoftware programming and consultancy services",
      "85000000\tHealth and social work services",
      "90500000\tRefuse and waste related services",
      "98514000\tDomestic services",
      "98910000\tServices specific to international organisations and bodies"
    ];

    const parsedData = cpvData
      .map((row) => {
        const [code, ...descParts] = row.split("\t");
        const description = descParts.join(" ").trim();
        return { code: code?.trim() || "", description: description || "" };
      })
      .filter(item => item.code && item.description);

    const searchBox = document.getElementById('searchBox');
    const resultList = document.getElementById('resultList');
    const selectedBox = document.getElementById('selectedBox');
    const copyBtn = document.getElementById('copyBtn');
    const cutBtn = document.getElementById('cutBtn');

    let currentFocus = -1;

    function getSearchMode() {
      const checked = document.querySelector('input[name="searchMode"]:checked');
      return checked ? checked.value : 'anywhere';
    }

    function escapeHtml(text) {
      return text
        .replaceAll(/&/g, '&amp;')
        .replaceAll(/</g, '&lt;')
        .replaceAll(/>/g, '&gt;');
    }

    function escapeRegExp(text) {
      return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function splitTerms(input) {
      return input
        .split(',')
        .map(t => t.trim())
        .filter(Boolean)
        .map(t => t.toLowerCase());
    }

    function textToWords(textLower) {
      return textLower.split(/[^a-z0-9]+/i).filter(Boolean);
    }

    function matchesTermAnyWhere(codeLower, descLower, term) {
      return codeLower.includes(term) || descLower.includes(term);
    }

    function matchesTermStart(codeLower, descLower, term) {
      if (codeLower.startsWith(term)) return true;
      const words = textToWords(descLower);
      return words.some(w => w.startsWith(term));
    }

    function matchesTermExact(codeLower, descLower, term) {
      if (codeLower === term) return true;
      if (term.includes(' ')) {
        // Exact phrase as a whole (word boundary on both ends)
        const re = new RegExp(`\\b${escapeRegExp(term)}\\b`, 'i');
        return re.test(descLower);
      }
      const words = textToWords(descLower);
      return words.includes(term);
    }

    function itemMatches({ code, description }, terms, mode) {
      if (terms.length === 0) return false;
      const codeLower = code.toLowerCase();
      const descLower = description.toLowerCase();

      return terms.every(term => {
        if (mode === 'start') return matchesTermStart(codeLower, descLower, term);
        if (mode === 'exact') return matchesTermExact(codeLower, descLower, term);
        return matchesTermAnyWhere(codeLower, descLower, term); // anywhere
      });
    }

    function highlightText(rawText, terms, mode) {
      if (!terms.length) return escapeHtml(rawText);
      let safe = escapeHtml(rawText);

      // Build regexes per term based on mode
      const regexes = terms.map(term => {
        if (mode === 'start') return new RegExp(`\\b${escapeRegExp(term)}`, 'gi');
        if (mode === 'exact') return new RegExp(`\\b${escapeRegExp(term)}\\b`, 'gi');
        return new RegExp(`${escapeRegExp(term)}`, 'gi'); // anywhere
      });

      // Apply each regex sequentially; protect already wrapped segments
      regexes.forEach(re => {
        safe = safe.replace(re, (m) => `<span class="highlight">${m}</span>`);
      });
      return safe;
    }

    function renderResults(items, terms, mode) {
      resultList.innerHTML = '';
      currentFocus = -1;

      if (!terms.length) return;

      const fragment = document.createDocumentFragment();
      items.slice(0, 500).forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span class="code">${highlightText(item.code, terms, mode)}</span>
          <span class="desc">${highlightText(item.description, terms, mode)}</span>
        `;
        li.addEventListener('click', () => addCPVToBox(item.code));
        fragment.appendChild(li);
      });
      resultList.appendChild(fragment);
    }

    function updateResults() {
      const raw = searchBox.value || '';
      const terms = splitTerms(raw);
      const mode = getSearchMode();

      if (terms.length === 0) {
        resultList.innerHTML = '';
        return;
      }

      const matches = parsedData.filter(item => itemMatches(item, terms, mode));
      renderResults(matches, terms, mode);
    }

    function addCPVToBox(code) {
      const existing = selectedBox.value
        .split(',')
        .map(s => s.trim())
        .filter(Boolean);
      if (!existing.includes(code)) existing.push(code);
      selectedBox.value = existing.join(', ');
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } finally { document.body.removeChild(ta); }
      return Promise.resolve();
    }

    function copySelected() {
      const text = selectedBox.value.trim();
      if (!text) return;
      copyToClipboard(text);
    }

    function cutSelected() {
      const text = selectedBox.value.trim();
      if (!text) return;
      copyToClipboard(text).then(() => { selectedBox.value = ''; });
    }

    // Keyboard navigation for results
    function removeActive(items) { [...items].forEach(el => el.classList.remove('active')); }
    function addActive(items) {
      if (!items.length) return;
      removeActive(items);
      if (currentFocus >= items.length) currentFocus = 0;
      if (currentFocus < 0) currentFocus = items.length - 1;
      items[currentFocus].classList.add('active');
      items[currentFocus].scrollIntoView({ block: 'nearest' });
    }

    searchBox.addEventListener('input', updateResults);
    document.querySelectorAll('input[name="searchMode"]').forEach(el => {
      el.addEventListener('change', updateResults);
    });

    searchBox.addEventListener('keydown', (e) => {
      const items = resultList.getElementsByTagName('li');
      if (e.key === 'ArrowDown') { currentFocus++; addActive(items); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { currentFocus--; addActive(items); e.preventDefault(); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        if (currentFocus > -1 && items[currentFocus]) {
          const codeEl = items[currentFocus].querySelector('.code');
          const code = codeEl ? codeEl.textContent.trim() : '';
          if (code) addCPVToBox(code);
        }
      }
    });

    copyBtn.addEventListener('click', copySelected);
    cutBtn.addEventListener('click', cutSelected);
  </script>
</body>
</html>
