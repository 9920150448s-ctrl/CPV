<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TOT CPV Code Search</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a35;
      --muted: #94a3b8;
      --text: #e2e8f0;
      --accent: #60a5fa;
      --accent-2: #34d399;
      --danger: #ef4444;
      --border: #1f2a4a;
      --highlight: #fde68a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, 'Helvetica Neue', Arial, 'Apple Color Emoji', 'Segoe UI Emoji';
      background: radial-gradient(1200px 600px at 10% -10%, rgba(96,165,250,0.12), transparent 40%),
                  radial-gradient(1000px 600px at 110% -10%, rgba(34,197,94,0.12), transparent 40%),
                  var(--bg);
      color: var(--text);
    }
    h2 { margin: 0 0 16px; font-weight: 700; letter-spacing: 0.2px; }

    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.03);
    }

    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    .muted { color: var(--muted); font-size: 13px; }

    .search {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0e1530;
      color: var(--text);
      outline: none;
      font-size: 14px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.35);
    }
    input[type="text"]::placeholder { color: #7b8794; }

    .toggles { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    .toggle {
      display: inline-flex; align-items: center; gap: 8px;
      background: #0e1530; border: 1px solid var(--border);
      padding: 8px 10px; border-radius: 999px; font-size: 13px; color: var(--muted);
    }
    .toggle input { accent-color: var(--accent); }

    ul#resultList {
      list-style: none; margin: 0; padding: 0; max-height: 46vh; overflow: auto;
      border-radius: 12px; border: 1px solid var(--border);
      background: #0c1228;
    }
    ul#resultList li {
      padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.04);
      cursor: pointer; display: flex; gap: 10px; align-items: baseline;
    }
    ul#resultList li:last-child { border-bottom: none; }
    ul#resultList li:hover { background: rgba(96,165,250,0.08); }
    ul#resultList li.active { outline: 2px solid var(--accent); outline-offset: -2px; }

    .code { color: var(--accent-2); font-weight: 600; font-variant-numeric: tabular-nums; min-width: 7.5ch; }
    .title { color: var(--text); }

    .highlight { background: var(--highlight); color: #111827; padding: 0 2px; border-radius: 3px; }
    .not-found { color: var(--muted); padding: 14px; text-align: center; }

    textarea#selectedBox {
      width: 100%; min-height: 100px; padding: 12px 14px; border-radius: 12px;
      border: 1px solid var(--border); background: #0e1530; color: var(--text);
      resize: vertical; font-size: 14px;
    }

    .button-row { display: flex; gap: 10px; justify-content: flex-end; }
    button {
      background: linear-gradient(180deg, #1f3a8a, #1e40af);
      color: white; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer;
      box-shadow: 0 4px 14px rgba(30,64,175,0.45);
    }
    button.secondary { background: linear-gradient(180deg, #065f46, #047857); box-shadow: 0 4px 14px rgba(4,120,87,0.45); }
    button:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <h2>TOT CPV Code Search</h2>

  <div class="panel search">
    <input type="text" id="searchBox" placeholder="Enter CPV code, keyword, or multiple terms separated by commas or spaces..." autocomplete="off" />
    <div class="toggles">
      <label class="toggle"><input type="checkbox" id="prefixModeToggle" /> Prefix Search (start of string)</label>
      <label class="toggle"><input type="checkbox" id="anywhereExactStartToggle" /> Anywhere Exact Start (start of any word)</label>
      <span class="muted">Tip: If both are off, default is 'contains anywhere'.</span>
    </div>
  </div>

  <ul id="resultList"></ul>

  <div class="panel" style="margin-top:12px;">
    <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
      <span class="muted">Selected CPV codes (comma-separated)</span>
      <div class="button-row">
        <button class="secondary" onclick="cutSelected()">Cut Selected</button>
        <button onclick="copySelected()">Copy Selected</button>
      </div>
    </div>
    <textarea id="selectedBox" placeholder="Hi Sunil... Selected CPV codes will appear here, separated by commas..."></textarea>
  </div>

  <script>
    // Minimal sample data so the page works immediately. Replace with the full cpvData list as needed.
    const cpvData = [
      "03000000\tAgricultural, farming, fishing, forestry and related products",
      "03100000\tAgricultural and horticultural products",
      "03110000\tCrops",
      "03111000\tSeeds",
      "03120000\tHorticultural products",
      "45000000\tConstruction work",
      "45200000\tWorks for complete or part construction and civil engineering work",
      "72000000\tIT services: consulting, software development, Internet and support",
      "72200000\tSoftware programming and consultancy services",
      "98514000\tDomestic services"
    ];

    const searchBox = document.getElementById('searchBox');
    const resultList = document.getElementById('resultList');
    const selectedBox = document.getElementById('selectedBox');

    const prefixModeToggle = document.getElementById('prefixModeToggle');
    const anywhereExactStartToggle = document.getElementById('anywhereExactStartToggle');

    let currentFocusIndex = -1;

    function escapeHtml(text) {
      return text
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function tokenize(text) {
      return text.toLowerCase().split(/[^a-z0-9]+/i).filter(Boolean);
    }

    function parseQuery(raw) {
      return raw
        .toLowerCase()
        .split(/[\s,]+/)
        .map(s => s.trim())
        .filter(Boolean);
    }

    function matchesTerm(text, term) {
      const lower = text.toLowerCase();
      if (prefixModeToggle.checked) {
        return lower.startsWith(term);
      }
      if (anywhereExactStartToggle.checked) {
        const tokens = tokenize(text);
        return tokens.some(t => t.startsWith(term));
      }
      return lower.includes(term);
    }

    function matchesAllTerms(text, terms) {
      for (const term of terms) {
        if (!matchesTerm(text, term)) return false;
      }
      return true;
    }

    function splitCodeAndTitle(row) {
      const [code, title] = row.split(/\t|\s{2,}/);
      return { code: code ? code.trim() : '', title: title ? title.trim() : '' };
    }

    function highlight(text, terms) {
      // Build regex for word-boundary starts if anywhereExactStart; otherwise simple includes highlight
      if (terms.length === 0) return escapeHtml(text);
      let html = escapeHtml(text);

      // Sort terms by length desc to avoid nested overlaps
      const ordered = [...terms].sort((a,b) => b.length - a.length);

      if (prefixModeToggle.checked) {
        const term = ordered[0];
        const re = new RegExp('^(' + escapeRegExp(term) + ')', 'i');
        html = html.replace(re, '<span class="highlight">$1</span>');
        return html;
      }

      if (anywhereExactStartToggle.checked) {
        // Highlight token starts: \bterm
        for (const term of ordered) {
          const re = new RegExp('\\b(' + escapeRegExp(term) + ')', 'gi');
          html = html.replace(re, '<span class="highlight">$1</span>');
        }
        return html;
      }

      // Default contains
      for (const term of ordered) {
        const re = new RegExp('(' + escapeRegExp(term) + ')', 'gi');
        html = html.replace(re, '<span class="highlight">$1</span>');
      }
      return html;
    }

    function escapeRegExp(s) {
      return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function updateResults() {
      const terms = parseQuery(searchBox.value);
      resultList.innerHTML = '';
      currentFocusIndex = -1;

      if (terms.length === 0) {
        renderList(cpvData.slice(0, 100));
        return;
      }

      const filtered = [];
      for (const row of cpvData) {
        const { code, title } = splitCodeAndTitle(row);
        const haystack = `${code} ${title}`;
        if (matchesAllTerms(haystack, terms)) filtered.push(row);
        if (filtered.length >= 200) break; // performance cap
      }

      if (filtered.length === 0) {
        resultList.innerHTML = `<li class="not-found">No matches found</li>`;
        return;
      }

      renderList(filtered);
    }

    function renderList(rows) {
      const terms = parseQuery(searchBox.value);
      const frag = document.createDocumentFragment();
      rows.forEach((row, idx) => {
        const { code, title } = splitCodeAndTitle(row);
        const li = document.createElement('li');
        li.innerHTML = `<span class="code">${highlight(code, terms)}</span><span class="title">${highlight(title, terms)}</span>`;
        li.addEventListener('click', () => selectCPV(code));
        frag.appendChild(li);
      });
      resultList.innerHTML = '';
      resultList.appendChild(frag);
    }

    function selectCPV(code) {
      addCPVToBox(code);
      // Copy to clipboard immediately for convenience
      copyToClipboard(code);
    }

    function addCPVToBox(code) {
      const current = selectedBox.value.trim();
      if (!current) {
        selectedBox.value = code;
        return;
      }
      const parts = current.split(',').map(s => s.trim()).filter(Boolean);
      if (!parts.includes(code)) parts.push(code);
      selectedBox.value = parts.join(', ');
    }

    function copySelected() {
      const text = selectedBox.value.trim();
      if (!text) return;
      copyToClipboard(text);
    }

    function cutSelected() {
      const text = selectedBox.value.trim();
      if (!text) return;
      copyToClipboard(text);
      selectedBox.value = '';
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
    }

    // Keyboard navigation (optional)
    searchBox.addEventListener('keydown', (e) => {
      const items = Array.from(resultList.querySelectorAll('li'));
      if (items.length === 0) return;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        currentFocusIndex = (currentFocusIndex + 1) % items.length;
        setActive(items);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        currentFocusIndex = (currentFocusIndex - 1 + items.length) % items.length;
        setActive(items);
      } else if (e.key === 'Enter') {
        if (currentFocusIndex >= 0 && currentFocusIndex < items.length) {
          e.preventDefault();
          const codeEl = items[currentFocusIndex].querySelector('.code');
          const code = codeEl ? codeEl.textContent.trim() : '';
          if (code) selectCPV(code);
        }
      }
    });

    function setActive(items) {
      items.forEach(el => el.classList.remove('active'));
      if (currentFocusIndex >= 0 && currentFocusIndex < items.length) {
        items[currentFocusIndex].classList.add('active');
        items[currentFocusIndex].scrollIntoView({ block: 'nearest' });
      }
    }

    searchBox.addEventListener('input', updateResults);
    prefixModeToggle.addEventListener('change', () => {
      if (prefixModeToggle.checked) {
        // If prefix mode is on, you can keep anywhereExactStart on or off; no forced exclusivity
      }
      updateResults();
    });
    anywhereExactStartToggle.addEventListener('change', updateResults);

    // Initial render
    updateResults();
  </script>
</body>
</html>
